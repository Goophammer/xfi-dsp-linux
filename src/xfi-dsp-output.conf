# xfi-dsp-output.conf - ACP mixer path for the X-Fi DSP output (src/xfi-dsp-profile.conf): the taskbar volume is the
# driver's "DSP Master" control (the DSP's master volume after the effects; dB scale -50..0). No mute element:
# PipeWire mutes in software.
[General]
description = X-Fi DSP

[Element DSP Master]
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
