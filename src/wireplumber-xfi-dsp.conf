# wireplumber-xfi-dsp.conf - give the Creative X-Fi 20K1 our ACP profile set (installed by src/xfi_dsp_install.sh to
# ~/.config/wireplumber/wireplumber.conf.d/xfi-dsp.conf; the profile set path is filled in at install time).
# Profile "X-Fi DSP" = ALSA device 6 through the card's DSP, taskbar volume = the driver's "DSP Master".
monitor.alsa.rules = [
  {
    matches = [ { device.vendor.id = "0x1102", device.product.id = "0x0005" } ]
    actions = { update-props = { device.profile-set = "@PROFILE_SET@", api.acp.disable-pro-audio = true } }
  }
]
