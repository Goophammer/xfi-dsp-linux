# xfi-dsp-mic.conf - ACP mixer path, firmware hp71: the input port "X-Fi DSP Mic" (src/xfi-dsp-profile.conf). Selects the mic with the
# driver's "DSP Recording Source"; the input volume is "DSP Mic" (DSP Mic Capture Volume).
[General]
description = X-Fi DSP Mic
priority = 20

[Element DSP Recording Source]
enumeration = select

[Option DSP Recording Source:Mic]
name = xfi-mic

[Element DSP Mic]
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
