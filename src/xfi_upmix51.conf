# xfi_upmix51.conf - "CMSS-3D" (Xpand) for ent51 (5.1 speakers): stereo -> 5.1 for the X-Fi sink, a PipeWire filter
# graph (run by xfi_upmix.sh when the X-Fi output has 6 channels; the tray's "Stereo Envelopment" switch, shown as
# CMSS-3D + Xpand in ent51), modelled on Windows' CMSS-3D Xpand on speakers (user, 2026-11-17): the center plays the
# music as soon as it is on, the slider fades the music into the rears, which sound more ambient, with the instruments
# more prominent than the voices. So: fronts unchanged; center = (L+R)/2, fixed; rear left = 0.75 L - 0.25 R (right
# mirrored): a voice in the middle comes out at 0.5 (-6 dB), instruments panned to a side almost full (full L/R: the
# voices overpowered the instruments; 0.65/0.35 + full range: the rears pumped - user 2026-11-17); high-pass 150 Hz
# (bass made them pump, as in gamehp's filter; the sub and fronts carry it), delayed 15 ms (they widen the sound
# instead of pulling it backwards) and softened above ~7 kHz. LFE stays empty: Bass Redirection feeds the subwoofer.
# The amount (xfi_upmix.sh, 0..100 %) scales the rear mixers by a/70 (50 % = 0.71, -3 dB).
# Surround (the tray's Xpand/Surround choice, xfi_upmix.sh mode): the slider moves the whole sound from front to back,
# as Windows' CMSS-3D Surround on speakers (fronts and center x (1 - x), rears x): equal-power cross-fade, fronts and
# center cos(x 90 deg), rears = the plain left/right music sin(x 90 deg), x = amount / 100. The final mixers outL/outR/
# rlout/rrout pick the path; switching is live (no restart, no gap).
# Input: as many channels as the X-Fi output (6), only FL/FR used (2026-11-18): a browser's (Chromium) stream set up for
# the X-Fi's channels could not be re-shaped to a 2-channel input while running ("links failed to activate", silence).
context.properties = { log.level = 2 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt  flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "X-Fi DSP (Stereo Envelopment)"
      media.name = "X-Fi DSP (Stereo Envelopment)"
      filter.graph = {
        nodes = [
          { type = builtin name = inL  label = copy }
          { type = builtin name = inR  label = copy }
          { type = builtin name = inC label = copy }
          { type = builtin name = inLFE label = copy }
          { type = builtin name = inRL label = copy }
          { type = builtin name = inRR label = copy }
          { type = builtin name = outL label = mixer control = { "Gain 1" = 1.0 } }
          { type = builtin name = outR label = mixer control = { "Gain 1" = 1.0 } }
          { type = builtin name = center label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
          { type = builtin name = rlmix label = mixer control = { "Gain 1" = 0.5357 "Gain 2" = -0.1786 } }
          { type = builtin name = rrmix label = mixer control = { "Gain 1" = 0.5357 "Gain 2" = -0.1786 } }
          { type = builtin name = rlhp label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
          { type = builtin name = rrhp label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
          { type = builtin name = rldel label = delay config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.015 } }
          { type = builtin name = rrdel label = delay config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.015 } }
          { type = builtin name = rl   label = bq_lowpass control = { "Freq" = 7000.0 "Q" = 0.707 } }
          { type = builtin name = rr   label = bq_lowpass control = { "Freq" = 7000.0 "Q" = 0.707 } }
          { type = builtin name = rlout label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
          { type = builtin name = rrout label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
          { type = builtin name = lfe  label = mixer control = { "Gain 1" = 0.0 } }
        ]
        links = [
          { output = "inL:Out" input = "outL:In 1" }
          { output = "inR:Out" input = "outR:In 1" }
          { output = "inL:Out" input = "center:In 1" }
          { output = "inR:Out" input = "center:In 2" }
          { output = "inL:Out" input = "lfe:In 1" }
          { output = "inL:Out" input = "rlmix:In 1" }
          { output = "inR:Out" input = "rlmix:In 2" }
          { output = "inR:Out" input = "rrmix:In 1" }
          { output = "inL:Out" input = "rrmix:In 2" }
          { output = "rlmix:Out" input = "rlhp:In" }
          { output = "rrmix:Out" input = "rrhp:In" }
          { output = "rlhp:Out" input = "rldel:In" }
          { output = "rrhp:Out" input = "rrdel:In" }
          { output = "rldel:Out" input = "rl:In" }
          { output = "rrdel:Out" input = "rr:In" }
          { output = "rl:Out" input = "rlout:In 1" }
          { output = "inL:Out" input = "rlout:In 2" }
          { output = "rr:Out" input = "rrout:In 1" }
          { output = "inR:Out" input = "rrout:In 2" }
        ]
        inputs = [ "inL:In" "inR:In" "inC:In" "inLFE:In" "inRL:In" "inRR:In" ]
        outputs = [ "outL:Out" "outR:Out" "center:Out" "lfe:Out" "rlout:Out" "rrout:Out" ]
      }
      capture.props = { node.name = "xfi_upmix" media.class = Audio/Sink audio.position = [ FL FR FC LFE RL RR ] }
      playback.props = { node.name = "xfi_upmix.out" node.passive = true audio.position = [ FL FR FC LFE RL RR ]
                         target.object = "@XFI@" }
    }
  }
]
