# xfi-dsp.conf - PipeWire/ACP profile set for the Creative X-Fi (snd_ctxfi, our build): the Windows-mode output: ALSA device 6 ("XFi Windows path", through the X-Fi DSP) with the driver's
# "DSP Master" control as its hardware volume; and ALSA device 7 ("XFi Windows mic", Windows' recording path)
# with "DSP Mic Capture Volume" as the input volume - (path file xfi-dsp-output.conf; NOT element-output = ...: PipeWire
# 1.6.8 ACP crashes in mapping_paths_probe with it - WirePlumber segfault loop, 2026-10-30) - the DSP's master volume AFTER the effects, as Windows' volume slider.
# @OUT_MAP@ (xfi_dsp_install.sh): stereo, or for a 7.1 firmware (XFI_MODE=hp71) the stream's order FL FR FC LFE BL BR SL SR.
# @IN_PATHS@: the input path, for hp71 two: the ports X-Fi DSP Mic and What U Hear.
# Selected for the card by the WirePlumber rule wireplumber-xfi-dsp.conf (device.profile-set). Priority 70: the
# "X-Fi DSP" profile wins over Analog Stereo Duplex (output 7000+ vs 6565) unless you pick another one.

[Mapping xfi-dsp]
description = X-Fi DSP
device-strings = hw:%f,6
channel-map = @OUT_MAP@
paths-output = @PATHS_DIR@/xfi-dsp-output
direction = output
priority = 70

[Mapping xfi-dsp-mic]
description = X-Fi DSP Mic
device-strings = hw:%f,7
channel-map = left,right
paths-input = @IN_PATHS@
direction = input
priority = 70

# Only these two profiles, instead of every output x input combination of the distro's list. Analog Stereo stays as the fallback for when the normal
# driver is loaded (another kernel, DSP not started); xfi_dsp_install.sh adds its mapping from the distro's list. The names are used by xfi_profile.sh.
[General]
auto-profiles = no

[Profile output:xfi-dsp+input:xfi-dsp-mic]
description = X-Fi DSP
output-mappings = xfi-dsp
input-mappings = xfi-dsp-mic
priority = 7120

[Profile output:analog-stereo+input:analog-stereo]
description = Analog Stereo (normal driver)
output-mappings = analog-stereo
input-mappings = analog-stereo
priority = 6565

