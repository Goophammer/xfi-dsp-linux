# xfi-dsp-input.conf - ACP mixer path for the X-Fi DSP mic (src/xfi-dsp-profile.conf, ALSA device 7): the input
# volume is the firmware's "DSP Mic Capture Volume" (Windows' recording level slider; 97 = Windows 100). No mute
# element: PipeWire mutes in software.
[General]
description = X-Fi DSP Mic

[Element DSP Mic]
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right
