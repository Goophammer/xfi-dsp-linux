# xfi_upmix.conf - "Stereo Envelopment" (tray): stereo -> 7.1 for gamehp's X-Fi sink, a PipeWire filter graph (run by xfi_upmix.sh as its own
# process: pipewire -c this file). Fronts unchanged, center = (L+R)/2 ("voice centering"), rear and side = (L-R)/2
# delayed 12 ms, right side inverted ("ambience extraction": what differs between left and right is mostly the room).
# The ambience is band-limited to 150 Hz..5 kHz: above that, cymbals and hiss in the delayed rear copy came back
# through CMSS-3D as squeaky artefacts (user, 2026-11-11); below it, bass made it pump.
# The X-Fi's CMSS-3D then places the 8 channels around your head.
context.properties = { log.level = 2 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt  flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "X-Fi DSP (Stereo Envelopment)"
      media.name = "X-Fi DSP (Stereo Envelopment)"
      filter.graph = {
        nodes = [
          { type = builtin name = inL  label = copy }
          { type = builtin name = inR  label = copy }
          { type = builtin name = outL label = copy }
          { type = builtin name = outR label = copy }
          { type = builtin name = center label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
          { type = builtin name = diff label = mixer control = { "Gain 1" = 0.5 "Gain 2" = -0.5 } }
          { type = builtin name = hp   label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
          { type = builtin name = lp   label = bq_lowpass  control = { "Freq" = 5000.0 "Q" = 0.707 } }
          { type = builtin name = amb  label = delay config = { "max-delay" = 0.1 } control = { "Delay (s)" = 0.012 } }
          { type = builtin name = rl   label = copy }
          { type = builtin name = rr   label = mixer control = { "Gain 1" = -1.0 } }
          { type = builtin name = sl   label = copy }
          { type = builtin name = sr   label = mixer control = { "Gain 1" = -1.0 } }
          { type = builtin name = lfe  label = mixer control = { "Gain 1" = 0.0 } }
        ]
        links = [
          { output = "inL:Out" input = "outL:In" }
          { output = "inR:Out" input = "outR:In" }
          { output = "inL:Out" input = "center:In 1" }
          { output = "inR:Out" input = "center:In 2" }
          { output = "inL:Out" input = "diff:In 1" }
          { output = "inR:Out" input = "diff:In 2" }
          { output = "inL:Out" input = "lfe:In 1" }
          { output = "diff:Out" input = "hp:In" }
          { output = "hp:Out" input = "lp:In" }
          { output = "lp:Out" input = "amb:In" }
          { output = "amb:Out" input = "rl:In" }
          { output = "amb:Out" input = "rr:In 1" }
          { output = "amb:Out" input = "sl:In" }
          { output = "amb:Out" input = "sr:In 1" }
        ]
        inputs = [ "inL:In" "inR:In" ]
        outputs = [ "outL:Out" "outR:Out" "center:Out" "lfe:Out" "rl:Out" "rr:Out" "sl:Out" "sr:Out" ]
      }
      capture.props = { node.name = "xfi_upmix" media.class = Audio/Sink audio.position = [ FL FR ] }
      playback.props = { node.name = "xfi_upmix.out" node.passive = true audio.position = [ FL FR FC LFE RL RR SL SR ]
                         target.object = "@XFI@" }
    }
  }
]
