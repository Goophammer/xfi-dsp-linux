# xfi-dsp-wuh.conf - ACP mixer path, firmware gamehp and ent: the input port "What U Hear". The driver sets its level (1.0), PipeWire's volume stays
# in software: the card's gain at the top of DSP Mic makes the mix clip.
[General]
description = What U Hear
priority = 10

[Element DSP Recording Source]
enumeration = select

[Option DSP Recording Source:What U Hear]
name = xfi-wuh

[Element DSP Mic]
volume = ignore
